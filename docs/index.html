<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- This page used to be the product's public face. lacre.dev is now the site, so
     this is a redirect stub: one page cannot be two public faces without splitting
     the ranking between them and showing visitors different copy depending on which
     one they found (#260).

     The redirect is three things together, because no one of them covers everyone:
     the canonical for crawlers, the 0-second refresh for browsers, and a visible
     link for anyone the refresh does not move, including a reader whose browser
     blocks it. A 0-second refresh is a redirect, not a timed limit, so WCAG 2.2.1
     does not apply; test/site.test.ts allows it here and nowhere else.

     The interactive chain demo that used to live here is at demo.html, with the
     fonts and other assets it needs still in this directory. -->
<link rel="canonical" href="https://lacre.dev/">
<meta http-equiv="refresh" content="0;url=https://lacre.dev/">
<meta name="robots" content="noindex, follow">

<title>Lacre — tamper-evident receipts for what your agents report</title>
<meta name="description" content="Lacre has moved to lacre.dev.">

<!-- Icons, generated from packages/site/app/icon.svg by scripts/generate-icons.mjs
     and byte-identical to the ones the app serves (#257). Both are served from
     this directory: no third-party host. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- The same policy the demo page declares: this page loads nothing at all, and
     GitHub Pages cannot send headers, so it is stated in a meta tag. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<style>
  :root{color-scheme:light dark;--ink:#141a22;--paper:#e8e8e4;--muted:#696861;--link:#0b57d0}
  @media (prefers-color-scheme:dark){:root{--ink:#e8e8e4;--paper:#141a22;--muted:#9a9a93;--link:#9ab8f5}}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;
       font:17px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding:16px}
  main{max-width:36rem;text-align:center}
  h1{font-size:22px;margin:0 0 12px}
  p{margin:0 0 12px;color:var(--muted)}
  a{color:var(--link)}
</style>
</head>
<body>
<main>
  <h1>Lacre has moved to lacre.dev</h1>
  <p>If you are not sent there automatically, follow this link.</p>
  <p><a href="https://lacre.dev/">Go to lacre.dev</a></p>
  <p>The interactive chain demo that used to be on this page is still here: <a href="demo.html">open the demo</a>. The source is at <a href="https://github.com/JaredKlopstein/lacre">github.com/JaredKlopstein/lacre</a>.</p>
</main>
</body>
</html>
